# ===================================================================
# Placement Preparation Tracker - Application Configuration
# ===================================================================

# Server Port (Default is 8080)
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
# Database URL: Points to MySQL running locally on port 3307
# createDatabaseIfNotExist=true will automatically create the database if it doesn't exist
spring.datasource.url=jdbc:mysql://localhost:3307/placement_tracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# MySQL Credentials
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
# ddl-auto=update automatically creates or updates database tables based on our Model entity classes
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries in console (useful for learning and debugging)
spring.jpa.show-sql=true

# Format SQL output nicely in logs
spring.jpa.properties.hibernate.format_sql=true

# Dialect is automatically detected by Hibernate 6+ based on the JDBC driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
